id: worker
version: 0.2.0
lifecycle: [deleted]

# Tool metadata (description / schema / i18n) lives HERE; the execute handlers
# live in src/index.ts. `manifestConfig()` joins the two: the manifest supplies
# every tool's description/input_schema/required_config, the code supplies only
# `execute`. This keeps the model-facing contract (and its translations) out of
# the implementation, exactly like the bundled extension.
#
# EXEC_WARNING: appended to exec / job-start (and their `command` argument) —
# the remote worker already runs every job as a tracked background task, so
# shell-level backgrounding and output redirection break observability.
#
# ONE sandbox list, TWO tool families. This extension drives the SAME
# config-registered easyworker sandboxes in two ways:
#   * worker-* tools   run shell commands / read-write files (`exec`, `read`, …)
#   * computer-* tools drive a native GUI through the platform accessibility
#     tree (`computer-snapshot`, `computer-action`, …) via `xa11y`/`adb`.
# Every tool takes an optional `sandbox` argument selecting one of the
# `sandboxes` entries by name; the first entry is the default. There is NO
# sandbox-creation tool — sandboxes are registered in config. Not every sandbox
# can be driven by computer-* (it needs the accessibility CLI): call
# `list-sandboxes` to see each sandbox's OS and whether a11y is available.

tools:
  - name: info
    description: >-
      Show the connected easyworker environment: OS/arch, shell, workspace
      root, home dir (`~`), service DNS and boot id. File tools accept a
      leading `~` as an alias for this home dir.
    descriptions:
      zh: 查看所连 easyworker 的环境：OS/架构、shell、工作区根目录、主目录（`~`）、服务域名与 boot id。文件工具的 `~` 前缀即指该主目录。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
      required: []
    required_config: [sandboxes]

  - name: exec
    description: >-
      Run a short shell command in the worker workspace and wait up to `timeout`
      seconds. Returns the job id always; on completion up to 1000 lines of
      output, on timeout the oldest 200 lines plus a note that the job is still
      running. IMPORTANT: the remote worker runs every command as a background
      job and records its full output. Do NOT background the command yourself
      with &, nohup, setsid, disown, or `&` in a subshell; do NOT truncate or
      redirect output with pipes (e.g. `| head`/`| tail`) or redirection (e.g.
      `> file`, `2>&1`, `>> file`); do NOT run a daemon/server in the foreground
      expecting the call to return. Run the command as-is (the worker streams
      and stores stdout/stderr), then read the result with the job-output/job-wait
      tools.
    descriptions:
      zh: >-
        在工作区运行一个短命令，最多等待 `timeout` 秒。总是返回 job id；完成时最多返回 1000
        行输出，超时则返回最旧的 200 行并提示任务仍在运行。重要：远端 worker 会把每条命令都作为后台任务运行并记录完整输出。请勿自行用
        &、nohup、setsid、disown 或子 shell 的 & 将命令放到后台；请勿用管道截断输出（如 `| head`/`| tail`）或重定向输出（如
        `> file`、`2>&1`、`>> file`）；也请勿在前台运行常驻的守护进程/服务并指望调用立即返回。请原样运行命令（worker
        会流式记录 stdout/stderr），再用 job-output/job-wait 工具读取结果。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        command:
          type: string
          description: >-
            Shell command to run. IMPORTANT: the remote worker runs every command
            as a background job and records its full output. Do NOT background
            the command yourself with &, nohup, setsid, disown, or `&` in a
            subshell; do NOT truncate or redirect output with pipes (e.g. `|
            head`/`| tail`) or redirection (e.g. `> file`, `2>&1`, `>> file`); do
            NOT run a daemon/server in the foreground expecting the call to
            return. Run the command as-is (the worker streams and stores
            stdout/stderr), then read the result with the job-output/job-wait
            tools.
          descriptions:
            zh: >-
              要运行的 shell 命令。重要：远端 worker 会把每条命令都作为后台任务运行并记录完整输出。请勿自行用
              &、nohup、setsid、disown 或子 shell 的 & 将命令放到后台；请勿用管道截断输出（如 `| head`/`| tail`）或重定向输出（如
              `> file`、`2>&1`、`>> file`）；也请勿在前台运行常驻的守护进程/服务并指望调用立即返回。请原样运行命令（worker
              会流式记录 stdout/stderr），再用 job-output/job-wait 工具读取结果。
        workdir:
          type: string
          description: >-
            Working directory: relative to the workspace root, absolute, or
            starting with `~` (the worker home).
          descriptions:
            zh: 工作目录：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
        timeout:
          type: integer
          description: Synchronous wait ceiling in seconds (default 5, max 60).
          descriptions:
            zh: 同步等待上限（秒，默认 5，最大 60）。
        env:
          type: object
          description: Extra environment variables for the job.
          descriptions:
            zh: 为任务附加的环境变量。
          additionalProperties:
            type: string
      required: [command]
    required_config: [sandboxes]

  - name: job-start
    description: >-
      Start a long-running shell command and return the job id immediately (no
      waiting). Drive it with job-wait/job-output/job-stdin/job-kill. IMPORTANT:
      the remote worker runs every command as a background job and records its
      full output. Do NOT background the command yourself with &, nohup, setsid,
      disown, or `&` in a subshell; do NOT truncate or redirect output with
      pipes (e.g. `| head`/`| tail`) or redirection (e.g. `> file`, `2>&1`, `>>
      file`); do NOT run a daemon/server in the foreground expecting the call to
      return. Run the command as-is (the worker streams and stores
      stdout/stderr), then read the result with the job-output/job-wait tools.
    descriptions:
      zh: >-
        启动一个长时间运行的 shell 命令并立即返回 job id（不等待）。用
        job-wait/job-output/job-stdin/job-kill 进行后续控制。重要：远端 worker 会把每条命令都作为后台任务运行并记录完整输出。请勿自行用
        &、nohup、setsid、disown 或子 shell 的 & 将命令放到后台；请勿用管道截断输出（如 `| head`/`| tail`）或重定向输出（如
        `> file`、`2>&1`、`>> file`）；也请勿在前台运行常驻的守护进程/服务并指望调用立即返回。请原样运行命令（worker
        会流式记录 stdout/stderr），再用 job-output/job-wait 工具读取结果。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        command:
          type: string
          description: >-
            Shell command to run. IMPORTANT: the remote worker runs every command
            as a background job and records its full output. Do NOT background
            the command yourself with &, nohup, setsid, disown, or `&` in a
            subshell; do NOT truncate or redirect output with pipes (e.g. `|
            head`/`| tail`) or redirection (e.g. `> file`, `2>&1`, `>> file`); do
            NOT run a daemon/server in the foreground expecting the call to
            return. Run the command as-is (the worker streams and stores
            stdout/stderr), then read the result with the job-output/job-wait
            tools.
          descriptions:
            zh: >-
              要运行的 shell 命令。重要：远端 worker 会把每条命令都作为后台任务运行并记录完整输出。请勿自行用
              &、nohup、setsid、disown 或子 shell 的 & 将命令放到后台；请勿用管道截断输出（如 `| head`/`| tail`）或重定向输出（如
              `> file`、`2>&1`、`>> file`）；也请勿在前台运行常驻的守护进程/服务并指望调用立即返回。请原样运行命令（worker
              会流式记录 stdout/stderr），再用 job-output/job-wait 工具读取结果。
        workdir:
          type: string
          description: >-
            Working directory: relative to the workspace root, absolute, or
            starting with `~` (the worker home).
          descriptions:
            zh: 工作目录：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
        timeout:
          type: integer
          description: >-
            Wall-clock deadline in seconds (max 600). At expiry the worker
            kills the job's whole process tree (state becomes killed) while
            KEEPING the recorded output — cleaner than wrapping the command in
            `timeout`, which swallows output. Omit for no deadline.
          descriptions:
            zh: >-
              墙钟截止秒数（最大 600）。到点后 worker 杀死整个进程树（状态变为
              killed）并保留已记录的输出——比在外层包 `timeout` 命令更干净（后者会吞掉输出）。省略表示不限时。
        env:
          type: object
          description: Extra environment variables for the job.
          descriptions:
            zh: 为任务附加的环境变量。
          additionalProperties:
            type: string
      required: [command]
    required_config: [sandboxes]

  - name: job-output
    description: >-
      Read a job's output by line window (offset/limit; offset negative counts
      from the end). Display is capped at 1000 lines / 120 KiB.
    descriptions:
      zh: 按行窗口读取任务输出（offset/limit；offset 为负从末尾计数）。展示上限 1000 行 / 120 KiB。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        job-id:
          type: string
          description: Background job id.
          descriptions:
            zh: 后台任务 id。
        offset:
          type: integer
          description: Start line offset (negative = from the end, default 0).
          descriptions:
            zh: 起始行偏移（负值从末尾算，默认 0）。
        limit:
          type: integer
          description: Maximum lines to return (default 200, max 1000).
          descriptions:
            zh: 最多返回行数（默认 200，最大 1000）。
        stream:
          type: string
          enum: [all, stdout, stderr]
          description: Which stream to read (default all).
          descriptions:
            zh: 读取哪个流（默认 all）。
      required: [job-id]
    required_config: [sandboxes]

  - name: job-wait
    description: >-
      Wait up to `timeout` seconds for a job to finish; returns the latest 200
      lines of output. If it is still running at the deadline, says so.
    descriptions:
      zh: 最多等待 `timeout` 秒让任务结束；返回最新的 200 行输出。若到点仍在运行则明确提示。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        job-id:
          type: string
          description: Background job id.
          descriptions:
            zh: 后台任务 id。
        timeout:
          type: integer
          description: Wait ceiling in seconds (default 60, max 600).
          descriptions:
            zh: 等待上限（秒，默认 60，最大 600）。
      required: [job-id]
    required_config: [sandboxes]

  - name: job-kill
    description: Kill a job and its whole process tree.
    descriptions:
      zh: 终止任务及其整个进程树。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        job-id:
          type: string
          description: Background job id.
          descriptions:
            zh: 后台任务 id。
      required: [job-id]
    required_config: [sandboxes]

  - name: job-stdin
    description: Write to a job's stdin, optionally closing it.
    descriptions:
      zh: 向任务的 stdin 写入数据，可选关闭。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        job-id:
          type: string
          description: Background job id.
          descriptions:
            zh: 后台任务 id。
        data:
          type: string
          description: Text to write to stdin.
          descriptions:
            zh: 写入 stdin 的文本。
        close:
          type: boolean
          description: Close stdin after writing.
          descriptions:
            zh: 写入后关闭 stdin。
      required: [job-id]
    required_config: [sandboxes]

  - name: job-list
    description: List jobs registered in the worker (id, state, exit code, command).
    descriptions:
      zh: 列出 worker 中登记的任务（id、状态、退出码、命令）。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
      required: []
    required_config: [sandboxes]

  - name: read
    description: >-
      Read a text file from the workspace with line numbers, windowed by
      offset/limit. Binary files are rejected. Reading records the lines as
      "seen" so a later edit may change them.
    descriptions:
      zh: >-
        从工作区读取文本文件并带行号，通过 offset/limit 分窗。二进制文件会被拒绝。读取会记录已“看到”的行，之后 edit
        才能修改这些行。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        path:
          type: string
          description: >-
            File path: relative to the workspace root, absolute, or starting
            with `~` (the worker home).
          descriptions:
            zh: 文件路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
        offset:
          type: integer
          description: Start line (0-based, default 0).
          descriptions:
            zh: 起始行（从 0 开始，默认 0）。
        limit:
          type: integer
          description: Maximum lines (default 200, max 1000).
          descriptions:
            zh: 最多行数（默认 200，最大 1000）。
      required: [path]
    required_config: [sandboxes]

  - name: write
    description: >-
      Write (overwrite) a text file in the workspace, then return the whole file
      with line numbers. Rejected if the content exceeds 120 KiB. The whole file
      counts as "seen", so it can be edited afterwards.
    descriptions:
      zh: >-
        向工作区写入（覆盖）文本文件，随后返回带行号的全文件。内容超过 120 KiB 会被拒绝。整个文件视为已“看到”，之后可直接
        edit。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        path:
          type: string
          description: >-
            File path: relative to the workspace root, absolute, or starting
            with `~` (the worker home).
          descriptions:
            zh: 文件路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
        content:
          type: string
          description: Full file content.
          descriptions:
            zh: 完整文件内容。
      required: [path, content]
    required_config: [sandboxes]

  - name: edit
    description: >-
      Edit a workspace file by line numbers (1-based). end-line == start-line - 1
      inserts before start-line; otherwise it replaces [start-line, end-line]
      (both endpoints INCLUSIVE). Line numbers are NEVER silently clamped:
      start-line may be (total + 1) to append at EOF, end-line == start-line - 1
      inserts (including [1, 0] head insert and [total+1, total] tail append),
      and any other out-of-range value is rejected. ANCHORS (both required):
      anchor-before / anchor-after = your own copy of the CURRENT text of the
      UNCHANGED lines immediately OUTSIDE the edit region — the line ABOVE it
      (line start-line - 1) and the line BELOW it (line end-line + 1) — taken
      from read output with the line-number prefix removed. They are NOT the
      edited lines themselves. When a side does not exist (start-line == 1 has
      no line above; end-line == total has no line below; an empty file has
      neither) you MUST pass an empty string for that argument. The tool
      compares with trim() and REFUSES the edit (without writing) if either
      anchor does not match — this catches any line-count shift above or below
      the region before writing. The session must have read (or written) the
      file first, may only edit lines it has seen, and the file must be
      unchanged since that read. A successful edit requires a fresh read.
      Returns a one-line summary followed by a unified diff.
    descriptions:
      zh: >-
        按行号（从 1 开始）编辑工作区文件。end-line == start-line - 1 时在 start-line 前插入；否则替换 [start-line,
        end-line]（含首含尾）。行号绝不静默夹取：start-line 可为（总行数 + 1）以在文件末尾追加，end-line == start-line - 1
        表示插入（含 [1, 0] 文件头插入与 [总行数+1, 总行数] 文件尾追加），其他越界值一律拒绝。ANCHOR（两个都必填）：anchor-before/anchor-after
        = 你对编辑区【外】紧邻的【不变】行的当前原文抄写——编辑区上方那行（第 start-line - 1 行）与下方那行（第 end-line + 1
        行），来自 read 输出、去掉行号前缀。它们不是被编辑的行本身。某一侧不存在时（start-line == 1 无上方行；end-line ==
        总行数 无下方行；空文件两侧都没有），该参数必须传空字符串。工具用 trim()
        比对，任一 anchor 不匹配则拒绝编辑（不写盘）——这能在写盘前发现编辑区上方或下方的任何行数位移。会话必须先 read（或
        write）过该文件，只能修改已“看到”的行，且文件自读取后不得变化。编辑成功后需重新 read。返回一行摘要及本次改动的 unified diff。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        path:
          type: string
          description: >-
            File path: relative to the workspace root, absolute, or starting
            with `~` (the worker home).
          descriptions:
            zh: 文件路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
        start-line:
          type: integer
          description: Start line (1-based).
          descriptions:
            zh: 起始行（从 1 开始）。
        end-line:
          type: integer
          description: End line (1-based, inclusive); == start-line - 1 means insert.
          descriptions:
            zh: 结束行（从 1 开始，含端点）；等于 start-line - 1 表示插入。
        content:
          type: string
          description: Replacement (for the inclusive [start-line, end-line] range) or inserted text.
          descriptions:
            zh: 替换文本（替换 [start-line, end-line] 闭区间）或插入文本。
        anchor-before:
          type: string
          description: >-
            Your copy of the CURRENT text of the UNCHANGED line ABOVE the edit
            region (line start-line - 1), from read output without the
            line-number prefix. NOT the edited line. Pass an empty string when
            start-line == 1 (no line above).
          descriptions:
            zh: 你对编辑区上方那条【不变】行（第 start-line - 1 行）当前原文的抄写，来自 read 输出、去掉行号前缀。不是被编辑的行。start-line == 1（无上方行）时传空字符串。
        anchor-after:
          type: string
          description: >-
            Your copy of the CURRENT text of the UNCHANGED line BELOW the edit
            region (line end-line + 1), from read output without the line-number
            prefix. NOT the edited line. Pass an empty string when end-line ==
            total (no line below).
          descriptions:
            zh: 你对编辑区下方那条【不变】行（第 end-line + 1 行）当前原文的抄写，来自 read 输出、去掉行号前缀。不是被编辑的行。end-line == 总行数（无下方行）时传空字符串。
      required: [path, start-line, end-line, anchor-before, anchor-after]
    required_config: [sandboxes]

  - name: list
    description: >-
      List a workspace path as a breadth-first tree (levels 1..depth) with
      sizes. Directories beyond the cap stay collapsed.
    descriptions:
      zh: 以广度优先树（第 1..depth 层）列出工作区路径并显示大小。超过上限的目录保持折叠。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        path:
          type: string
          description: >-
            Directory or file path: relative to the workspace root, absolute,
            or starting with `~` (the worker home).
          descriptions:
            zh: 目录或文件路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
        limit:
          type: integer
          description: Maximum entries (default 200, max 1000).
          descriptions:
            zh: 最大条目数（默认 200，最大 1000）。
        depth:
          type: integer
          description: Levels to expand (default 3).
          descriptions:
            zh: 展开层数（默认 3）。
      required: [path]
    required_config: [sandboxes]

  - name: delete
    description: Delete a file or a whole directory tree in the workspace.
    descriptions:
      zh: 删除工作区中的一个文件或整个目录树。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        path:
          type: string
          description: >-
            File or directory path: relative to the workspace root, absolute,
            or starting with `~` (the worker home).
          descriptions:
            zh: 文件或目录路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
      required: [path]
    required_config: [sandboxes]

  - name: move
    description: Move or rename a file / directory tree to a new path.
    descriptions:
      zh: 移动或重命名文件 / 目录树到新路径。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        from:
          type: string
          description: >-
            Source path: relative to the workspace root, absolute, or starting
            with `~` (the worker home).
          descriptions:
            zh: 源路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
        to:
          type: string
          description: >-
            Destination path: relative to the workspace root, absolute, or
            starting with `~` (the worker home).
          descriptions:
            zh: 目标路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
      required: [from, to]
    required_config: [sandboxes]

  - name: copy
    description: Copy a file / directory tree onto a new path (recursively).
    descriptions:
      zh: 将文件 / 目录树复制到新路径（递归）。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        from:
          type: string
          description: >-
            Source path: relative to the workspace root, absolute, or starting
            with `~` (the worker home).
          descriptions:
            zh: 源路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
        to:
          type: string
          description: >-
            Destination path: relative to the workspace root, absolute, or
            starting with `~` (the worker home).
          descriptions:
            zh: 目标路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
      required: [from, to]
    required_config: [sandboxes]

  - name: download
    description: Download a stored file (agent `file:<code>`) into the workspace at `path`.
    descriptions:
      zh: 将已存储文件（agent 的 `file:<code>`）下载到工作区的 `path`。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        code:
          type: string
          description: File code (with or without the `file:` prefix).
          descriptions:
            zh: 文件 code（可带或不带 `file:` 前缀）。
        path:
          type: string
          description: >-
            Destination path in the workspace: relative, absolute, or starting
            with `~` (the worker home).
          descriptions:
            zh: 工作区中的目标路径：相对、绝对，或以 `~`（worker 主目录）开头。
      required: [code, path]
    required_config: [sandboxes]

  - name: upload
    description: >-
      Upload a workspace file to the agent file store, returning its
      `file:<code>`. The content type is derived by the agent.
    descriptions:
      zh: 将工作区文件上传到 agent 文件存储，返回 `file:<code>`。内容类型由 agent 推断。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to run against (see list-sandboxes).
            Omit when only one is configured. This selects among sandboxes set
            in config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        path:
          type: string
          description: >-
            File path: relative to the workspace root, absolute, or starting
            with `~` (the worker home).
          descriptions:
            zh: 文件路径：相对工作区根、绝对路径，或以 `~`（worker 主目录）开头。
        name:
          type: string
          description: Stored file name (defaults to the basename).
          descriptions:
            zh: 存储文件名（默认取 basename）。
      required: [path]
    required_config: [sandboxes]

  # ---- observe -------------------------------------------------------------
  - name: computer-apps
    description: >-
      List the running applications whose accessibility tree is visible on the
      worker's desktop. Returns pid + name (the focused app is marked), and for
      Android the foreground package/activity.
    descriptions:
      zh: >-
        列出 worker 桌面上可见无障碍树的运行中应用。返回 pid + 名称（前台应用会标记），安卓则返回前台包名/Activity。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to drive (see list-sandboxes). Omit
            when only one is configured. This selects among sandboxes set in
            config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
      required: []
    required_config: [sandboxes]

  - name: computer-snapshot
    description: >-
      Capture the accessibility tree of an app (or the whole desktop / current
      Android screen). This is the preferred way to understand a GUI: it returns
      roles, names, values, states and bounds, and each element gets a stable
      `ref` (e.g. e12) usable as `target` in the interaction tools. Prefer this
      over computer-screenshot for deciding where to act.
    descriptions:
      zh: >-
        捕获某应用的无障碍树（或整个桌面 / 当前安卓屏幕）。这是理解 GUI 的首选方式：返回角色、名称、值、状态与
        边界框，每个元素都会得到一个稳定的 `ref`（如 e12），可作为交互工具里的 `target`。决定在哪里操作时优先用它而非
        computer-screenshot。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to drive (see list-sandboxes). Omit
            when only one is configured. This selects among sandboxes set in
            config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        app:
          type: string
          description: >-
            Application to snapshot (name or pid). Empty = the whole desktop
            (Linux) / current screen (Android).
          descriptions:
            zh: 要快照的应用（名称或 pid）。留空 = 整个桌面（Linux）/ 当前屏幕（安卓）。
        depth:
          type: number
          description: Limit the depth of the tree.
          descriptions:
            zh: 限制树的深度。
      required: []
    required_config: [sandboxes]

  - name: computer-find
    description: >-
      Find elements matching a CSS-like accessibility selector on the worker,
      optionally returning each match's center coordinates or bounds. On Linux
      the selector syntax is xa11y's (e.g. `button[name='OK']`,
      `text_field[name^='Search']`, `group > button`, `button:nth(2)`). Use the
      returned ref as `target` for interaction tools.
    descriptions:
      zh: >-
        在 worker 上查找匹配某个类 CSS 无障碍选择器的元素，可选返回每个匹配的中心坐标或边界框。Linux 上选择器语法为 xa11y
        的（如 `button[name='OK']`、`text_field[name^='Search']`、`group > button`、`button:nth(2)`）。把返回的
        ref 作为交互工具的 `target`。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to drive (see list-sandboxes). Omit
            when only one is configured. This selects among sandboxes set in
            config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        selector:
          type: string
          description: The accessibility selector to match.
          descriptions:
            zh: 要匹配的无障碍选择器。
        app:
          type: string
          description: Restrict the search to one application (name or pid).
          descriptions:
            zh: 将搜索限定到某个应用（名称或 pid）。
        output:
          type: string
          enum: [pretty, bounds, center]
          description: >-
            pretty = one line per match (default); bounds = `x,y,w,h`; center =
            `x,y`.
          descriptions:
            zh: pretty = 每个匹配一行（默认）；bounds = `x,y,w,h`；center = `x,y`。
      required: [selector]
    required_config: [sandboxes]

  # ---- interact (accessibility actions, coordinates as fallback) -----------
  - name: computer-action
    description: >-
      Perform an accessibility action on an element. Prefer this over coordinate
      clicks: it drives the app through its accessibility API and does not
      depend on focus/cursor state. Actions: press (click/invoke), focus, blur,
      toggle, expand, collapse, select, show-menu, scroll-into-view, increment,
      decrement, set-value (needs value), type-text (needs value).
    descriptions:
      zh: >-
        对元素执行无障碍操作。优先用它而非坐标点击：它通过无障碍 API 驱动应用，不依赖焦点/光标状态。动作：press（点击/调用）、focus、blur、toggle、expand、collapse、select、show-menu、scroll-into-view、increment、decrement、set-value（需 value）、type-text（需 value）。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to drive (see list-sandboxes). Omit
            when only one is configured. This selects among sandboxes set in
            config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        action:
          type: string
          enum: [press, focus, blur, toggle, expand, collapse, select, show-menu, scroll-into-view, increment, decrement, set-value, type-text]
          description: The action to perform.
          descriptions:
            zh: 要执行的动作。
        target:
          type: string
          description: >-
            Element ref from computer-snapshot (e.g. e12) or a selector.
          descriptions:
            zh: 来自 computer-snapshot 的元素 ref（如 e12）或选择器。
        value:
          type: string
          description: Value for set-value / type-text.
          descriptions:
            zh: set-value / type-text 的值。
        app:
          type: string
          description: Restrict to one application (name or pid).
          descriptions:
            zh: 限定到某个应用（名称或 pid）。
      required: [action, target]
    required_config: [sandboxes]

  - name: computer-click
    description: >-
      Click at screen coordinates (x,y). Use this only when no accessibility
      element matches (canvas/unknown widgets); otherwise prefer computer-action
      with a snapshot ref.
    descriptions:
      zh: >-
        在屏幕坐标 (x,y) 处点击。仅当没有无障碍元素匹配时（画布/未知控件）使用；否则优先用 computer-action 配合快照
        ref。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to drive (see list-sandboxes). Omit
            when only one is configured. This selects among sandboxes set in
            config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        x:
          type: number
          description: X coordinate (pixels).
          descriptions:
            zh: X 坐标（像素）。
        y:
          type: number
          description: Y coordinate (pixels).
          descriptions:
            zh: Y 坐标（像素）。
        button:
          type: string
          enum: [left, right, middle]
          description: Mouse button (default left).
          descriptions:
            zh: 鼠标键（默认 left）。
        count:
          type: number
          description: Click count, e.g. 2 for a double click (default 1).
          descriptions:
            zh: 点击次数，如 2 表示双击（默认 1）。
      required: [x, y]
    required_config: [sandboxes]

  - name: computer-type
    description: >-
      Type text into the focused element (or a named element first). For a text
      field with a snapshot ref, computer-action set-value is more reliable.
    descriptions:
      zh: >-
        向当前聚焦元素输入文本（或先聚焦某个命名元素）。对有快照 ref 的文本框，computer-action set-value 更可靠。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to drive (see list-sandboxes). Omit
            when only one is configured. This selects among sandboxes set in
            config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        text:
          type: string
          description: The text to type.
          descriptions:
            zh: 要输入的文本。
        target:
          type: string
          description: >-
            Element ref/selector to focus first (optional).
          descriptions:
            zh: 先聚焦的元素 ref/选择器（可选）。
        submit:
          type: boolean
          description: Press Enter after typing.
          descriptions:
            zh: 输入后按 Enter。
      required: [text]
    required_config: [sandboxes]

  - name: computer-key
    description: >-
      Press a key or key combination on the keyboard (e.g. `Return`, `Tab`,
      `ctrl+c`, `alt+F4`).
    descriptions:
      zh: 按下某个键或组合键（如 `Return`、`Tab`、`ctrl+c`、`alt+F4`）。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to drive (see list-sandboxes). Omit
            when only one is configured. This selects among sandboxes set in
            config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        key:
          type: string
          description: Key name or combination.
          descriptions:
            zh: 键名或组合键。
        held:
          type: array
          description: Additional keys held during the press.
          descriptions:
            zh: 按下期间额外按住的键。
          items:
            type: string
      required: [key]
    required_config: [sandboxes]

  - name: computer-scroll
    description: >-
      Scroll at a screen position. dx/dy are scroll deltas (positive dy scrolls
      down).
    descriptions:
      zh: 在某个屏幕位置滚动。dx/dy 为滚动增量（dy 为正表示向下滚动）。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to drive (see list-sandboxes). Omit
            when only one is configured. This selects among sandboxes set in
            config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        x:
          type: number
          description: X coordinate to scroll at.
          descriptions:
            zh: 滚动位置的 X 坐标。
        y:
          type: number
          description: Y coordinate to scroll at.
          descriptions:
            zh: 滚动位置的 Y 坐标。
        dx:
          type: number
          description: Horizontal delta.
          descriptions:
            zh: 水平增量。
        dy:
          type: number
          description: Vertical delta.
          descriptions:
            zh: 垂直增量。
      required: [x, y]
    required_config: [sandboxes]

  - name: computer-drag
    description: >-
      Drag from one screen position to another (e.g. drag-and-drop). On Android
      this is a swipe.
    descriptions:
      zh: 从一个屏幕位置拖拽到另一个（如拖放）。安卓上为滑动。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to drive (see list-sandboxes). Omit
            when only one is configured. This selects among sandboxes set in
            config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        from_x:
          type: number
          description: Start X coordinate.
          descriptions:
            zh: 起点 X 坐标。
        from_y:
          type: number
          description: Start Y coordinate.
          descriptions:
            zh: 起点 Y 坐标。
        to_x:
          type: number
          description: End X coordinate.
          descriptions:
            zh: 终点 X 坐标。
        to_y:
          type: number
          description: End Y coordinate.
          descriptions:
            zh: 终点 Y 坐标。
        duration_ms:
          type: number
          description: Duration in milliseconds.
          descriptions:
            zh: 持续时长（毫秒）。
      required: [from_x, from_y, to_x, to_y]
    required_config: [sandboxes]

  # ---- visual --------------------------------------------------------------
  - name: computer-screenshot
    description: >-
      Capture the screen as a PNG, stored and returned as a file:<code>
      reference. Use computer-snapshot for deciding where to act; use a
      screenshot to see rendering (images, canvases, games).
    descriptions:
      zh: >-
        将屏幕截取为 PNG，存储并以 file:<code> 引用返回。决定在哪里操作用 computer-snapshot；查看渲染（图片、画布、游戏）用截图。
    input_schema:
      type: object
      properties:
        sandbox:
          type: string
          description: >-
            Which registered sandbox to drive (see list-sandboxes). Omit
            when only one is configured. This selects among sandboxes set in
            config; there is no sandbox-creation tool.
          descriptions:
            zh: >-
              要操作的已注册沙箱（见 list-sandboxes）。仅配置一个时可省略。它只在 config
              中已注册的沙箱间选择；没有创建沙箱的工具。
        region:
          type: string
          description: >-
            Optional capture region `x,y,w,h`. Empty = full screen.
          descriptions:
            zh: 可选的截取区域 `x,y,w,h`。留空 = 全屏。
      required: []
    required_config: [sandboxes]

  # ---- discovery -----------------------------------------------------------
  - name: list-sandboxes
    description: >-
      List the sandboxes registered in this extension's config, one per line as
      `name<TAB>os<TAB>a11y=yes|no`. `os` is the sandbox's operating system
      (linux/macos/windows/android) and `a11y` says whether the computer-*
      tools can drive its GUI (the accessibility CLI is installed). The
      worker-* tools (exec/files) run on EVERY sandbox; the computer-* tools
      (GUI) require `a11y=yes`. Every tool takes an optional `sandbox` argument
      selecting one of these by name (omit it when only one is configured).
      Sandboxes are registered in config; there is no tool to create one.
    descriptions:
      zh: >-
        列出本扩展 config 中注册的沙箱，每行一个，格式为
        `name<TAB>os<TAB>a11y=yes|no`。`os` 是沙箱操作系统（linux/macos/windows/android），
        `a11y` 表示 computer-* 工具能否驱动其 GUI（是否安装了无障碍 CLI）。worker-* 工具（exec/文件）
        在所有沙箱上都能运行；computer-* 工具（GUI）需要 `a11y=yes`。所有工具都接受一个可选的 `sandbox`
        参数按名称选择其中之一（仅配置一个时可省略）。沙箱在 config 中注册；没有创建沙箱的工具。
    input_schema:
      type: object
      properties: {}
      required: []
    required_config: [sandboxes]

config:
  - name: sandboxes
    type: string
    scope: global
    default: ''
    description: >-
      JSON list of sandboxes this extension may run against, each
      {"name":"...","url":"http://worker:80","token":"..."}. The worker-*
      (exec/files) and computer-* (GUI) tools all address these same sandboxes;
      a tool's `sandbox` argument selects one by name and the first is the
      default when omitted. The computer-* tools additionally require the
      sandbox to have the accessibility CLI (see list-sandboxes `a11y`).
    descriptions:
      zh: >-
        本扩展可操作的沙箱列表（JSON），每项
        {"name":"...","url":"http://worker:80","token":"..."}。worker-*（exec/文件）与
        computer-*（GUI）工具都作用于这同一批沙箱；工具的 `sandbox` 参数按名称选择其一，省略时用第一个作为默认。
        computer-* 工具还要求该沙箱安装无障碍 CLI（见 list-sandboxes 的 `a11y`）。
